interface:
  display_name: "TikTok 视频拆分"
  short_description: "把一条 TikTok 视频拆成可追溯的分镜素材包"
  default_prompt: "使用 $tiktok-video-splitter 对这条视频做本地零 Token 分镜拆解，默认自动判断灵敏度；只有我明确授权上传和费用时才使用 AI 语义命名。"

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "remote"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
