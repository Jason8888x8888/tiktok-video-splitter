name: Bug report
description: Report a reproducible problem without sharing private media or credentials.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach API keys, cookies, signed URLs, private videos, account identifiers, or absolute local paths. Report security issues privately through the repository Security tab.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-beta.3
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - local
        - hybrid
        - validate-only
        - render-only
        - installation or discovery
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Include the command with private values replaced and the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant run-summary fields, tool versions, and error text after removing sensitive data.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, cookies, private media, user data, and absolute local paths.
          required: true
